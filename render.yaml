# Two services in the Creature Clash Render workspace.
# The kids' site autodeploys main. The room server sleeps on the free plan.

services:
  # Static site. Name matches https://creature-clash.onrender.com
  # The rewrite sends every path to index.html. The game stays on the home
  # address while you play, but a Vite app still needs this so any other
  # path does not 404.
  - type: web
    name: creature-clash
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: creature-clash-rooms
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://creature-clash.onrender.com
